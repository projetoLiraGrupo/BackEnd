spring.application.name=lira_api
server.port=${SERVER_PORT:8080}

# Banco local padrão: H2 em memória.
# Para MySQL, veja application-mysql.properties e rode com --spring.profiles.active=mysql
spring.datasource.url=${DB_URL:jdbc:h2:mem:lira;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}

spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

# Desenvolvimento local possui um fallback para a aplicação iniciar sem configuração externa.
# Em produção, defina JWT_SECRET com um valor longo e aleatório.
api.security.token.secret=${JWT_SECRET:dev-only-change-this-secret-before-production-2026-lira-api}
api.security.token.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
api.security.cookie.secure=${COOKIE_SECURE:false}

# Front-ends locais comuns. Em produção, troque por seu domínio.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# AWS é opcional para o boot local. As credenciais seguem a cadeia padrão do AWS SDK
# (variáveis AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY, profile ~/.aws, IAM Role, etc.).
aws.s3.region=${AWS_REGION:us-east-1}
aws.s3.bucket-name=${AWS_S3_BUCKET:}
